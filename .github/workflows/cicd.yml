name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python source
        run: python -m compileall -q src app tests

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t ecommerce-return-prediction:ci .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-test-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

      - name: Pull and smoke-test published image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --detach --rm --name ecommerce-return-api \
            --publish 8000:8000 "$IMAGE"
          trap 'docker stop ecommerce-return-api >/dev/null' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > health.json; then
              break
            fi
            sleep 1
          done
          cat health.json
          jq --exit-status '.status == "healthy" and .model_loaded == true' health.json

          curl --fail --silent --show-error \
            --request POST http://127.0.0.1:8000/predict \
            --header "Content-Type: application/json" \
            --data '{"Product_Category":"Fashion","Product_Price_INR":2500,"Discount_Percent":20,"Expected_Delivery_Days":5,"Actual_Delivery_Days":7,"Customer_Rating_PreOrder":3.5,"Previous_Returns":2,"Previous_Orders":10,"Payment_Method":"Card","Damaged_Package_Flag":"No","Package_Size":"Medium","Promotion_Active":"Yes"}' \
            > prediction.json
          cat prediction.json
          jq --exit-status '
            (.predicted_return_status == "Returned"
              or .predicted_return_status == "Not Returned")
            and (.prediction_probability >= 0 and .prediction_probability <= 1)
            and ((.model_name | length) > 0)
          ' prediction.json
